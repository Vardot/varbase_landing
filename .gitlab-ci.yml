################################################################################
# GitLab CI for the Varbase Landing Page (Paragraphs) module (10.1.x line -
# Drupal ~11.4).
#
# Two halves:
#   1. The standard Drupal CI validation jobs (composer-lint, cspell, eslint,
#      phpcs, phpstan) provided by the drupalci templates. Every validate job
#      gates strictly (allow_failure:false).
#   2. A varbase-e2e BDD browser-test job (Playwright + Cucumber-js) that runs
#      the tests/features/drupal/** suite against a freshly installed Drupal
#      Standard site provisioned with the Varbase Landing Page stack
#      (varbase_media, varbase_seo, varbase_bootstrap_paragraphs, varbase_landing)
#      and the tests/varbase_landing_test recipe (Landing editor role +
#      landing_page permissions, admin theme for content forms).
################################################################################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  # The 10.1.x branch targets Drupal core 11.4 only. Pin the core version and
  # ignore the project's info.yml core_version_requirement when resolving it.
  DRUPAL_CORE: "11.4.0"
  IGNORE_PROJECT_DRUPAL_CORE_VERSION: "1"
  # Make every drupalci validate job blocking (a few default to
  # allow_failure:true). Combined with the per-job allow_failure:false overrides
  # below, the whole pipeline gates strictly.
  _ALL_VALIDATE_ALLOW_FAILURE: "0"
  COMPOSER_FLAGS: "--no-strict-lock"
  COMPOSER_MEMORY_LIMIT: "-1"
  # No yarn.lock is relied upon in CI; Yarn 4 defaults to immutable installs and
  # would refuse to create one. Allow lockfile creation in CI for every job.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

# = Validate stage (all blocking) =
# Force EVERY drupalci validate job that runs for this module to gate. The
# module ships no CSS/JS of its own, so drupalci does not add a stylelint job;
# the overrides below cover the jobs that do run.
composer-lint:
  allow_failure: false
cspell:
  allow_failure: false
eslint:
  allow_failure: false
phpcs:
  allow_failure: false
phpstan:
  allow_failure: false

# = Reusable before_script fragments (via !reference) =
.fragments:
  web_db: &web_db
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
  node_playwright: &node_playwright
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js - varbase-e2e's postinstall can clobber it under yarn 4.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium

# = varbase-e2e BDD - Drupal Standard profile + Varbase Landing stack =
varbase-e2e-test:
  extends: .testing-job-base
  needs: [composer]
  # Installing the Landing stack (media + entity browsers + paragraphs + seo)
  # through drush is heavy, so allow more than the default job wall-clock.
  timeout: 2h
  # Only the database service is needed. Playwright bundles its own Chromium,
  # so Selenium and chromedriver are not required.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
  before_script:
    - !reference [.fragments, web_db]
    - git config --global --add safe.directory "$CI_PROJECT_DIR" || true
    # Varbase Media config sets the image toolkit to ImageMagick. Install the
    # ImageMagick CLI + WebP delegate so image derivative generation during the
    # test install does not fatal (GD stays available as a fallback).
    - apt-get update -y > /dev/null || true
    - apt-get install -y --no-install-recommends imagemagick > /dev/null || true
    - apt-get install -y --no-install-recommends webp > /dev/null || true
    # Drupal core 11.4.0 is not yet installable through the drupal.org Composer
    # facade used by CI, so the composer job resolves to the latest available
    # 11.3.x. The static jobs validate the 11.4 target directly; this browser job
    # verifies runtime behavior on the closest installable core. Relax the
    # checked-out module info.yml core_version_requirement for the test site only
    # (this does NOT change the committed ~11.4.0 requirement) so the modules can
    # enable. Scan both the repo root and the web root.
    - |
      for SCAN in "$CI_PROJECT_DIR" "$CI_PROJECT_DIR/$_WEB_ROOT"; do
        find "$SCAN" -name '*.info.yml' -print0 2>/dev/null \
          | xargs -0 -r sed -i -E 's/core_version_requirement:[[:space:]]*~11\.4\.0/core_version_requirement: ^11.3 || ^11.4/'
      done
    - cd $CI_PROJECT_DIR
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install standard
        --db-url=$SIMPLETEST_DB --account-name=webmaster --account-pass=dD.123123ddd
        --site-name="Varbase Landing Page Test" -y
    # Media icon directory + Dropzone JS library needed by the media stack.
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files || true
    - mkdir -p $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files/styles $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files/media-icons/generic $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files/oembed_thumbnails || true
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files || true
    - mkdir -p $CI_PROJECT_DIR/$_WEB_ROOT/libraries/dropzone/dist/min
    - curl -sSL https://cdn.jsdelivr.net/npm/dropzone@5.9.3/dist/min/dropzone.min.js -o $CI_PROJECT_DIR/$_WEB_ROOT/libraries/dropzone/dist/min/dropzone.min.js || true
    # Standard does not include media; install it first so media.settings exists,
    # then satisfy varbase_media's icon-directory requirement.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install media media_library -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set media.settings icon_base_uri 'public://media-icons/generic' -y
    # Pre-install drimage_improved (a hard Varbase Media dependency) with its own
    # container rebuild BEFORE varbase_media, so its image_style_repository service
    # is registered before any config event subscriber references it.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install image drimage_improved -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # Create the Varbase editorial roles that the media / SEO / landing config
    # grants permissions to, before installing those modules (config grants fail
    # if the role is absent). The Landing editor role is created later by the
    # test recipe.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT role:create editor 'Editor' || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT role:create content_admin 'Content admin' || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT role:create site_admin 'Site admin' || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT role:create seo_admin 'SEO admin' || true
    # The composer-resolved drupal/varbase_media:~10.1.0 (canonical 10.1.x) still
    # carries a stale `configure: varbase_media.settings` info.yml key whose route
    # was removed on 10.1.x. Building that configure link during install fatals
    # with "Route varbase_media.settings does not exist". Strip the key from the
    # checked-out module info.yml for the test site only (does not change the
    # committed varbase_media package).
    - find $CI_PROJECT_DIR/$_WEB_ROOT -path '*/varbase_media/varbase_media.info.yml' -print0 2>/dev/null | xargs -0 -r sed -i -E '/^[[:space:]]*configure:[[:space:]]*varbase_media\.settings[[:space:]]*$/d'
    # Install focal_point + entity_embed/embed first so the varbase_media install
    # does not stop on their interactive requirements, then each module in its own
    # command so a single optional-config error cannot roll back the whole set.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install focal_point -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install entity_embed embed -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install varbase_media -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install varbase_seo -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install varbase_bootstrap_paragraphs -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install varbase_landing -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # Apply the test recipe: creates the Landing editor role, uses the admin theme
    # for content forms, and grants the landing_page permissions to the editorial
    # roles.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/tests/varbase_landing_test -y
    # Test users for the access matrix.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT user:create normaluser --mail="normaluser@example.test" --password="dD.123123ddd" || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT user:create landinguser --mail="landinguser@example.test" --password="dD.123123ddd" || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT user:role:add landing_editor landinguser || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    - !reference [.fragments, node_playwright]
  script:
    # cucumber.js loads only tests/features/drupal/**. Disable varbase-e2e's auto
    # HTML hook and run generate-reports explicitly so HTML + PDF land next to
    # the JSON in tests/reports/.
    - VARBASE_E2E_REPORT_DISABLE=1 ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
    - node ./node_modules/@vardot/varbase-e2e/bin/generate-reports.js
        --json tests/reports/cucumber_report.json
        --out  tests/reports/cucumber_report.html
        --format all
        --pdf-out tests/reports/cucumber_report.pdf
  allow_failure: false

# Allow the Varbase stack Composer plugins in the CI build (allow-plugins lives
# in varbase_project, not modules).
composer:
  before_script:
    - composer config --no-plugins allow-plugins.symfony/runtime true || true
    - composer config --no-plugins allow-plugins.composer/installers true || true
    - composer config --no-plugins allow-plugins.cweagans/composer-patches true || true
    - composer config --no-plugins allow-plugins.oomphinc/composer-installers-extender true || true
    - composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true || true
    - composer config --no-plugins allow-plugins.drupal/core-project-message true || true
    - composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true || true
    - composer config --no-plugins allow-plugins.phpstan/extension-installer true || true
    - composer config --no-plugins allow-plugins.php-http/discovery true || true
    - composer config --no-plugins allow-plugins.tbachert/spi true || true
    - composer config --no-plugins allow-plugins.vardot/varbase-patches true || true
    - composer require --no-update vardot/varbase-patches:~10.1.0
